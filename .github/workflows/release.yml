# On merge to main: release notes and risk summary (release agent), GitHub release, staged rollout with
# health checks and automatic rollback, post-deploy watch, the tickets it released moved to
# jira.stages.released, and ops tickets fixed by this release marked "fix deployed" so the verification
# window starts.
name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
env:
  W: .ai-sdlc/engine   # the workflow release this repo follows (checked out in each job)
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Workflow (the release this repo follows)
        uses: actions/checkout@v4
        with: { repository: tausif-amiron/AI-SDLC, path: .ai-sdlc/engine, fetch-depth: 0, token: "${{ secrets.AI_SDLC_REPO_TOKEN }}" }
      - name: Use that release
        run: git -C .ai-sdlc/engine checkout -q "$(node .ai-sdlc/engine/scripts/engine.mjs resolve "$(node -p "(require('./ai-sdlc.config.json').workflow || {}).version || 'stable'")")"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "**/package-lock.json" }
      - run: npm ci --prefix "$W"
      - run: npm install -g "@anthropic-ai/claude-code@$(cat "$W/.claude-code-version")"
      - name: Version
        id: v
        run: |
          echo "version=$(date -u +%Y.%m.%d)-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
          echo "prev=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Release notes and risk summary
        run: npm --prefix "$W" run release -- notes --version "${{ steps.v.outputs.version }}" --from "${{ steps.v.outputs.prev }}"
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
      - name: GitHub release
        run: gh release create "${{ steps.v.outputs.version }}" --notes-file ".ai-sdlc/release/${{ steps.v.outputs.version }}.md" --target "$GITHUB_SHA"
        env: { GH_TOKEN: "${{ github.token }}" }
      - name: Staged rollout
        run: npm --prefix "$W" run release -- deploy --version "${{ steps.v.outputs.version }}"
        env:
          DEPLOY_COMMAND: ${{ vars.DEPLOY_COMMAND }}
          ROLLBACK_COMMAND: ${{ vars.ROLLBACK_COMMAND }}
          HEALTH_URL: ${{ vars.HEALTH_URL }}
      - name: Watch window
        run: npm --prefix "$W" run release -- watch --version "${{ steps.v.outputs.version }}" --minutes "${{ vars.WATCH_MINUTES || 30 }}"
        env:
          ROLLBACK_COMMAND: ${{ vars.ROLLBACK_COMMAND }}
          HEALTH_URL: ${{ vars.HEALTH_URL }}
          OPS_METRIC_COMMAND: ${{ vars.OPS_METRIC_COMMAND }}
      - name: Move tickets released by this release
        run: |
          keys=$(git log --format=%B "${{ steps.v.outputs.prev }}..HEAD" | sed -n 's/^Ticket: *\([A-Z][A-Z0-9]*-[0-9]*\).*/\1/p' | sort -u | tr '\n' ' ')
          npm --prefix "$W" run release -- done $keys --version "${{ steps.v.outputs.version }}"
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_OPS_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_OPS_TOKEN }}
      - name: Mark ops tickets fixed by this release
        run: |
          keys=$(git log --format=%B "${{ steps.v.outputs.prev }}..HEAD" | sed -n 's/^Fixes: *\([A-Z][A-Z0-9]*-[0-9]*\).*/\1/p' | sort -u | tr '\n' ' ')
          npm --prefix "$W" run release -- fix-deployed $keys --version "${{ steps.v.outputs.version }}"
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_OPS_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_OPS_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
