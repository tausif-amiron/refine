# Hand-written breakages that matter for this product. Each must turn at least one test red.
# Rules: docs/TESTING.md#mutation-catalogue
# Fields: id, file (glob), find, replace, regex (optional, default false), note.

- id: drop-auth-middleware
  file: "apps/api/src/**/*.ts"
  find: "requireAuth,"
  replace: ""
  note: Removing auth from a route must fail a role-denial test.

- id: drop-audit-log
  file: "apps/api/src/**/*.ts"
  find: "audit("
  replace: "void ("
  note: A write without its audit log must fail a test.

- id: allow-all-roles
  file: "apps/api/src/**/*.ts"
  find: "hasPermission("
  replace: "(() => true)("
  note: Permission checks must be tested with a denied role.

- id: swallow-error-status
  file: "apps/api/src/**/*.ts"
  find: "status(404)"
  replace: "status(200)"
  note: Not-found handling must be tested.

- id: hide-error-state
  file: "apps/web/src/screens/**/*.tsx"
  find: "state === \"error\""
  replace: "false"
  note: Every screen error state must be rendered in a test.
